name: ReviewRouter v1.0.108 recovery E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Recover versioned Codex secret
        env:
          LEGACY_CODEX_AUTH_JSON: ${{ secrets.REVIEWROUTER_CODEX_AUTH_JSON }}
          RECOVERY_GITHUB_TOKEN: ${{ secrets.REVIEWROUTER_E2E_RECOVERY_GH_TOKEN }}
        shell: bash
        run: |
          set +x
          set -euo pipefail

          if [[ -z "${LEGACY_CODEX_AUTH_JSON:-}" || -z "${RECOVERY_GITHUB_TOKEN:-}" ]]; then
            echo "Required disposable recovery secret is missing" >&2
            exit 1
          fi

          recovery_root="${RUNNER_TEMP}/reviewrouter-v108-recovery"
          codex_home="${recovery_root}/codex-home"
          response_file="${recovery_root}/response.json"
          command_file="${recovery_root}/install.sh"
          mkdir -p "${codex_home}"
          chmod 700 "${recovery_root}" "${codex_home}"
          printf '%s' "${LEGACY_CODEX_AUTH_JSON}" > "${codex_home}/auth.json"
          chmod 600 "${codex_home}/auth.json"

          # Retry the transaction that already acquired recovery ownership.
          # A fresh id would correctly conflict with the active recovery fence.
          request_id="3357a8cc-a7a2-4b1e-b529-32e7724e9cd4"
          status="$(curl -q --silent --show-error \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${RECOVERY_GITHUB_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "$(jq -cn --arg request_id "${request_id}" '{repository:"777genius/review-router-saas-e2e",acknowledgement:"all_prior_installers_and_writers_are_stopped",accountSwitch:false,recoveryRequestId:$request_id}')" \
            https://reviewrouter.site/api/codex-rotating/cli/setup-recovery)"
          if [[ "${status}" != "200" ]]; then
            jq -r '.error // "unknown recovery error"' "${response_file}" >&2
            exit 1
          fi

          jq -er '.command' "${response_file}" > "${command_file}"
          if [[ "$(grep -o -- '--force-reseed' "${command_file}" | wc -l | tr -d ' ')" != "1" ]]; then
            echo "Unexpected recovery installer command" >&2
            exit 1
          fi
          sed -i 's/--force-reseed/--reuse-existing-auth-i-know-it-is-current/' "${command_file}"
          chmod 700 "${command_file}"

          export REVIEW_ROUTER_CODEX_HOME="${codex_home}"
          export GH_TOKEN="${RECOVERY_GITHUB_TOKEN}"
          bash "${command_file}" >/dev/null

          gh api repos/777genius/review-router-saas-e2e/actions/secrets \
            --jq '[.secrets[].name | select(startswith("REVIEWROUTER_CODEX_AUTH_JSON_R1228051727_"))] | if length == 1 then "versioned_secret_ready" else error("versioned secret cardinality invalid") end'
