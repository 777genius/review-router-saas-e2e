name: ReviewRouter OIDC claims disposable E2E

on:
  pull_request:
    types: [synchronize]

permissions: {}

jobs:
  claims:
    if: ${{ github.event.pull_request.number == 37 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Print non-secret OIDC source claims
        env:
          OIDC_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          OIDC_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          node <<'NODE'
          const response = await fetch(`${process.env.OIDC_REQUEST_URL}&audience=reviewrouter`, {
            headers: { authorization: `Bearer ${process.env.OIDC_REQUEST_TOKEN}` },
          });
          if (!response.ok) throw new Error(`oidc_request_failed:${response.status}`);
          const { value } = await response.json();
          const payload = value.split('.')[1].replaceAll('-', '+').replaceAll('_', '/');
          const claims = JSON.parse(Buffer.from(payload, 'base64').toString('utf8'));
          const allowed = [
            'repository', 'repository_id', 'workflow_ref', 'workflow_sha', 'ref', 'sha',
            'run_id', 'run_attempt', 'job_workflow_ref', 'job_workflow_sha', 'event_name',
          ];
          console.log(JSON.stringify(Object.fromEntries(allowed.map((key) => [key, claims[key] ?? null]))));
          NODE
