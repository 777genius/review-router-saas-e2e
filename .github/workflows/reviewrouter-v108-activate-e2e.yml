name: ReviewRouter v1.0.108 activation E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact SaaS release
        uses: actions/checkout@v4
        with:
          repository: 777genius/review-router-saas
          ref: fc8148940e4d333a1f1890dac08c5f70198d6832

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Activate attested versioned namespace
        env:
          DATABASE_URL: ${{ secrets.REVIEWROUTER_E2E_DATABASE_URL }}
          REVIEW_ROUTER_DATABASE_RECOVERY_WITNESS: ${{ secrets.REVIEWROUTER_E2E_DATABASE_RECOVERY_WITNESS }}
        run: |
          pnpm --filter @reviewrouter/web exec tsx -e '
            import { activateCodexRotatingSetup } from "@reviewrouter/features-provider-setup";
            import { requireReviewRouterDatabaseRecoveryWitness } from "@reviewrouter/platform-config";
            import { getPrisma } from "./src/server/prisma.ts";
            import { PrismaCodexRotatingSetupPayloadClaim } from "./src/server/prisma-codex-rotating-setup-payload-claim.ts";

            const prisma = getPrisma();
            try {
              const result = await activateCodexRotatingSetup({
                claimId: "codex_claim_0f7e14fb-4f02-4792-af87-e5e7205212fc",
                attemptId: "codex_attempt_c6ca366b-3b20-42e0-8053-f99822cbd6b3",
                repositoryId: "1228051727",
                namespaceId: "sns_6b9b9134e353614e3df3104f606e1e74",
                namespaceEpoch: "1",
                secretName: "REVIEWROUTER_CODEX_AUTH_JSON_R1228051727_P01cfca27f31e5f85_E1_6b9b9134e353614e3df3104f606e1e74",
                workflowPath: ".github/workflows/reviewrouter-codex.yml",
                workflowSourceCommitSha: "92808dfdb6c004a84a8800c9d111f0388ae78869",
                workflowSourceBlobSha: "7a868e45ddfc1f01c58bdb5d4f6db9e5da043b5f",
                workflowSourceSha256: "5b51aa3b9e7e4a943a52d6521a3c3fe1daedb7d4270d8e6a15fbce031ad26671",
                workflowSemanticSha256: "bae0846accd5bd166f39b5bc6a910e589b4d589dcd31ba5692600192565c06ef",
                sourceTrust: "trusted_default_branch_revision",
              }, {
                claims: new PrismaCodexRotatingSetupPayloadClaim(
                  prisma,
                  requireReviewRouterDatabaseRecoveryWitness(),
                ),
              });
              if (result.status !== "active") throw new Error("activation did not become active");
              console.log("versioned_namespace_active");
            } finally {
              await prisma["$disconnect"]();
            }
          '
